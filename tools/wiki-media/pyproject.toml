[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-media"
version = "0.1.0"
description = "Safe R2 media publisher for TokenBel Wiki"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
style = ["ruff==0.16.*"]

[project.scripts]
wiki-media = "wiki_media.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-vv --tb=short --durations=10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
unsafe-fixes = false
exclude = ["__init__.py"]

[tool.ruff.lint]
select = ["I", "W292", "E4", "E7", "E9", "F", "Q"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["resolver"]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
