{{ define "main" }}
  <article class="page">
    {{ partial "breadcrumbs.html" . }}
    <header class="flex flex-col gap-2 border-b border-gray-300 pb-2">
      <h1 class="text-3xl font-bold tracking-tight text-black sm:text-4xl">{{ .Title }}</h1>
      {{ with .Description }}<p class="text-lg leading-relaxed text-gray-700">{{ . }}</p>{{ end }}
      {{ partial "page-dates.html" . }}
    </header>
    <div class="article-content">
      {{ .Content }}
    </div>
    {{ with .GetTerms "tags" }}
      <footer class="article-footer">
        <h2 class="text-xl font-bold tracking-tight text-black">Теги</h2>
        <ul class="tag-list" aria-label="Теги статьи">
          {{ range . }}
            <li><a class="active-a" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
          {{ end }}
        </ul>
      </footer>
    {{ end }}
  </article>
{{ end }}
