{{ define "main" }}
  <article class="container article page-shell">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a href="{{ site.Home.RelPermalink }}">Главная</a>
      {{ with .CurrentSection }}<span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
      <span aria-hidden="true">/</span><span aria-current="page">{{ .Title }}</span>
    </nav>
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
      <time datetime="{{ .Lastmod.Format "2006-01-02" }}">Обновлено {{ .Lastmod.Format "02.01.2006" }}</time>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
