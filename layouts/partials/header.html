<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="TokenBel Wiki — главная">
      <span class="brand-name">TokenBel</span>
      <span class="brand-label">Wiki</span>
    </a>
    <nav class="main-nav" aria-label="Основная навигация">
      <ul>
        {{ range site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <a class="header-action" href="{{ site.Params.mainSiteURL }}">Открыть TokenBel <span aria-hidden="true">↗</span></a>
  </div>
</header>
