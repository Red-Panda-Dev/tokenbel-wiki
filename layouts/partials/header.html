<header class="fixed right-0 left-0 z-50 border-b border-gray-300 bg-white shadow-md">
  <div class="mx-auto flex h-16 items-center justify-between gap-4 px-4">
    <a class="inline-flex items-baseline gap-2 rounded-lg text-black no-underline transition hover:text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-600 motion-reduce:transition-none" href="{{ site.Home.RelPermalink }}" aria-label="TokenBel Wiki — главная">
      <span class="text-xl font-bold tracking-tight">TokenBel</span>
      <span class="rounded-full border border-gray-300 px-2 py-0.5 text-xs font-bold tracking-wider text-gray-700 uppercase">Wiki</span>
    </a>
    <nav class="relative order-3 w-full overflow-x-auto after:pointer-events-none after:absolute after:inset-y-0 after:right-0 after:w-8 after:bg-linear-to-l after:from-white after:to-transparent md:order-none md:w-auto md:flex-1 md:overflow-visible md:after:hidden" aria-label="Основная навигация">
      <ul class="flex w-max items-center gap-1 md:w-auto">
        {{ range site.Menus.main }}
          <li><a class="inline-flex min-h-11 items-center rounded-lg px-2 text-sm font-medium text-gray-700 underline-offset-2 transition hover:bg-gray-100 hover:text-blue-900 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600 aria-[current=page]:bg-blue-50 aria-[current=page]:text-blue-700 motion-reduce:transition-none" href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
