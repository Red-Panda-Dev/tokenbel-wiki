<header class="fixed right-0 left-0 z-50 border-b border-gray-300 bg-white shadow-md">
  <div class="mx-auto flex h-16 items-center justify-between gap-4 px-4">
    <a class="items-center justify-center inline-flex gap-2 rounded-lg  text-black" href="{{ site.Home.RelPermalink }}" aria-label="TokenBel Wiki — главная">
        <img src="{{ "wiki_logo.svg" | relURL }}" alt="TokenBel Wiki" class="h-10 w-auto rounded-lg">
      <span class="text-xl font-bold tracking-tight">TokenBel</span>
      <span class="rounded-lg border border-gray-700 px-1 text-xs font-bold tracking-wider text-gray-700 uppercase">Wiki</span>
    </a>
    <nav class="hidden md:block md:flex-1" aria-label="Основная навигация">
      <ul class="flex items-center gap-1">
        {{ range site.Menus.main }}
          <li><a class="header_btn inline-flex items-center" href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <details class="group md:hidden">
      <summary class="flex min-h-11 min-w-11 cursor-pointer list-none items-center justify-center rounded-lg text-gray-700 transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 [&::-webkit-details-marker]:hidden">
        <span class="sr-only">Основная навигация</span>
        <svg class="size-7 group-open:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg class="hidden size-7 group-open:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </summary>
      <nav class="absolute top-full right-0 left-0 max-h-[calc(100dvh-4rem)] overflow-y-auto border-t border-gray-300 bg-white shadow-md" aria-label="Основная навигация">
        <ul class="mx-auto flex max-w-screen-xl flex-col gap-1 px-4 py-2">
          {{ range site.Menus.main }}
            <li><a class="flex min-h-11 items-center rounded-lg px-3 text-sm font-medium text-gray-700 underline-offset-2 transition hover:bg-gray-100 hover:text-blue-900 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600 aria-[current=page]:bg-blue-50 aria-[current=page]:text-blue-700 motion-reduce:transition-none" href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    </details>
  </div>
</header>
