<nav class="breadcrumbs" aria-label="Хлебные крошки">
  <a class="active-a" href="{{ site.Home.RelPermalink }}">Главная</a>
  {{ range .Ancestors.Reverse }}
    {{ if ne .RelPermalink site.Home.RelPermalink }}
      <span aria-hidden="true">/</span><a class="active-a" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  {{ end }}
  <span aria-hidden="true">/</span><span aria-current="page" class="font-semibold text-black">{{ .Title }}</span>
</nav>
