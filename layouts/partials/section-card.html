<article class="wiki-card">
    <div class="flex-col md:flex-row gap-2 content-center inline-flex items-center">
        <div
            class="flex items-center rounded-lg bg-gray-100 text-gray-700 p-1"
            aria-hidden="true"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-8 w-8"
                viewBox="0 0 16 16"
            >
                <path d="M0 0h16v16H0z" fill="none" />
                <path
                    fill="none"
                    stroke="currentColor"
                    d="M2 8h12m-9.5 5v-3h-2v3m2 0v.5h-2V13m2 0h-2M9 13v-3H7v3m2 0v.5H7V13m2 0H7m6.5 0v-3h-2v3m2 0v.5h-2V13m2 0h-2m-7-7.5v-3h-2v3m2 0V6h-2v-.5m2 0h-2m6.5 0v-3H7v3m2 0V6H7v-.5m2 0H7m6.5 0v-3h-2v3m2 0V6h-2v-.5m2 0h-2"
                />
            </svg>
        </div>
        <h3 class="text-lg font-semibold">
            <a class="active-a" href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h3>
    </div>
    <p class="text-sm leading-relaxed text-gray-700">{{ .Description }}</p>
</article>
