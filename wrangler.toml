name = "tokenbel-wiki"
main = "worker.js"
compatibility_date = "2026-07-31"

workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Negotiation-скрипт должен видеть каждый запрос до статических ассетов
run_worker_first = true

[[routes]]
pattern = "wiki.tokenbel.info/*"
zone_name = "tokenbel.info"

[[routes]]
pattern = "wiki.tokenbel.info"
custom_domain = true

[placement]
mode = "smart"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
