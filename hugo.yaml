baseURL: "https://wiki.tokenbel.info/"
title: "Wiki TokenBel"
defaultContentLanguage: "ru"

languages:
  ru:
    locale: "ru-BY"
    label: "Русский"
    weight: 1
enableRobotsTXT: true
enableGitInfo: false

pagination:
  pagerSize: 12

taxonomies:
  tag: tags

params:
  description: "Справочные материалы, руководства и статистика TokenBel."
  mainSiteURL: "https://tokenbel.info/"
  dashboardURL: "https://dashboard.tokenbel.info/"
  tokensURL: "https://dashboard.tokenbel.info/tokens/"
  secondMarketURL: "https://dashboard.tokenbel.info/secondhand/"
  sharesURL: "https://dashboard.tokenbel.info/shares/"
  bondsURL: "https://dashboard.tokenbel.info/bonds/"
  repositoryURL: "https://github.com/Red-Panda-Dev/tokenbel-wiki"

menus:
  main:
    - name: "Новости"
      pageRef: "/news"
      weight: 10
    - name: "Статистика"
      pageRef: "/statistics"
      weight: 20
    - name: "Руководство"
      pageRef: "/guides"
      weight: 30
    - name: "Политика"
      pageRef: "/policies"
      weight: 40
    - name: "О проекте"
      pageRef: "/about"
      weight: 50

build:
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: css

module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

caches:
  images:
    dir: ":cacheDir/images"
