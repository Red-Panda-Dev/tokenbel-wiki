baseURL: "https://wiki.tokenbel.info/"
title: "TokenBel Wiki"
defaultContentLanguage: "ru"

languages:
  ru:
    locale: "ru-BY"
    label: "Русский"
    weight: 1
enableRobotsTXT: true
enableGitInfo: false
ignoreFiles:
  - "AGENTS\\.md$"

pagination:
  pagerSize: 12

taxonomies:
  tag: tags

params:
  description: "TokenBel Wiki — подробные руководства, актуальная статистика рынка и справочные материалы о сервисе TokenBel и ценных бумагах Беларуси."
  socialImage: "/og-default.png"
  socialImageAlt: "TokenBel Wiki — руководства и статистика рынка Беларуси"
  socialImageType: "image/png"
  socialImageWidth: 1200
  socialImageHeight: 630
  organizationID: "https://tokenbel.info/#organization"
  organizationName: "TokenBel"
  organizationLogo: "/wiki_logo.webp"
  organizationSameAs:
    - "https://t.me/tokenbel"
    - "https://github.com/Red-Panda-Dev"
  seo:
    titleMaxLength: 60
    descriptionMaxLength: 155
    descriptionMinLength: 120
    homeTitle: "TokenBel Wiki — руководства и статистика рынка Беларуси"
    descriptionSuffix: "Подробности, инструкции и статистика — в базе знаний TokenBel."
    descriptionFallback: "TokenBel Wiki — подробные руководства, актуальная статистика рынка и справочные материалы о сервисе TokenBel и ценных бумагах Беларуси."
    ogLocale: "ru_BY"
    language: "ru-BY"
  mainSiteURL: "https://tokenbel.info/"
  dashboardURL: "https://dashboard.tokenbel.info/"
  tokensURL: "https://dashboard.tokenbel.info/tokens/"
  secondMarketURL: "https://dashboard.tokenbel.info/secondhand/"
  sharesURL: "https://dashboard.tokenbel.info/shares/"
  bondsURL: "https://dashboard.tokenbel.info/bonds/"
  repositoryURL: "https://github.com/Red-Panda-Dev/tokenbel-wiki"

menus:
  main:
    - name: "Новости"
      pageRef: "/news"
      weight: 10
    - name: "Статистика"
      pageRef: "/statistics"
      weight: 20
    - name: "Руководство"
      pageRef: "/guides"
      weight: 30
    - name: "Политика"
      pageRef: "/policies"
      weight: 40
    - name: "О проекте"
      pageRef: "/about"
      weight: 50

caches:
  images:
    dir: ":cacheDir/images"
